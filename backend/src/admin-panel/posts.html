<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeeMe Admin - Posts</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">SeeMe</div>
      <div class="brand-sub">Admin Dashboard</div>
      <nav>
        <a href="/admin/dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="/admin/users.html" data-page="users">Users</a>
        <a href="/admin/posts.html" data-page="posts" class="active">Posts</a>
        <a href="/admin/audit-log.html" data-page="audit">Audit Log</a>
      </nav>
      <div class="sidebar-footer">
        <div class="admin-info">Signed in as <span class="admin-name"></span></div>
        <button class="btn btn-sm btn-danger" onclick="logout()">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Content Moderation</h1>
        <p>Browse and moderate all posts</p>
      </div>

      <div id="alert-area"></div>

      <div class="table-container" style="margin-bottom:24px">
        <div class="table-header">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="Search by caption...">
            <button class="btn btn-primary btn-sm" id="search-btn">Search</button>
          </div>
        </div>
      </div>

      <div id="posts-container" class="posts-grid">
        <div class="loading">Loading posts...</div>
      </div>

      <div id="pagination" class="pagination" style="margin-top:20px"></div>
    </main>
  </div>

  <!-- Delete Confirm Modal -->
  <div id="delete-modal" class="modal-overlay">
    <div class="modal">
      <h3>Delete Post</h3>
      <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px">
        Are you sure you want to permanently delete this post? This action cannot be undone.
      </p>
      <div class="modal-actions">
        <button class="btn btn-sm" onclick="hideModal('delete-modal')">Cancel</button>
        <button class="btn btn-danger btn-sm" id="confirm-delete">Delete Post</button>
      </div>
    </div>
  </div>

  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/utils.js"></script>
  <script src="/admin/js/posts.js"></script>
</body>
</html>
