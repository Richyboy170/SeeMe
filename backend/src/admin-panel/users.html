<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeeMe Admin - Users</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">SeeMe</div>
      <div class="brand-sub">Admin Dashboard</div>
      <nav>
        <a href="/admin/dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="/admin/users.html" data-page="users" class="active">Users</a>
        <a href="/admin/posts.html" data-page="posts">Posts</a>
        <a href="/admin/audit-log.html" data-page="audit">Audit Log</a>
      </nav>
      <div class="sidebar-footer">
        <div class="admin-info">Signed in as <span class="admin-name"></span></div>
        <button class="btn btn-sm btn-danger" onclick="logout()">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>User Management</h1>
        <p>Search, filter, and manage user accounts</p>
      </div>

      <div class="table-container">
        <div class="table-header">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="Search by username or email...">
            <button class="btn btn-primary btn-sm" id="search-btn">Search</button>
          </div>
          <div class="filters-bar">
            <select id="filter-status">
              <option value="">All Status</option>
              <option value="active">Active</option>
              <option value="suspended">Suspended</option>
              <option value="banned">Banned</option>
            </select>
            <select id="filter-role">
              <option value="">All Roles</option>
              <option value="user">User</option>
              <option value="admin">Admin</option>
              <option value="super_admin">Super Admin</option>
            </select>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-table">
            <tr><td colspan="6" class="loading">Loading users...</td></tr>
          </tbody>
        </table>

        <div id="pagination" class="pagination"></div>
      </div>
    </main>
  </div>

  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/utils.js"></script>
  <script src="/admin/js/users.js"></script>
</body>
</html>
